<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Qoutes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="random">
        <h1>Daily Inspiration </h1>
        <div class="quotes">
            <p  class="your">Your quote:</p>
            <p class="quote"> "Your future depends on what you do today"</p>
            <button class="btn"><i class="fa-solid fa-brain"></i> New Quote</button>
        </div>
        <div class="btns">
            <div class="toast">✔ Copied!</div>
            <button class="copy">

                copy <i class="fa-solid fa-copy"></i></button>
            <button class="share">share <i class="fa-solid fa-share-nodes"></i></button>
            <button class="fav">Add To Favorite <i class="fa-regular fa-heart"></i> </button>
        </div>

    </section>

    <script type="module" src="app.js"></script>
</body>

</html>
